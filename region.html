<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地域勢力図ランキング - ろぎてむ</title>
    <style>
        :root { --sun: #f6ad55; --moon: #63b3ed; --earth: #68d391; --gold: #ffd700; --bg: #f0f4f8; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #2d3748; }
        .container { max-width: 480px; margin: 0 auto; }
        
        /* ワクワク感を出すランキングヘッダー */
        .top-ranking { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 24px; padding: 20px; color: white; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(118,75,162,0.3); text-align: center; }
        .top-ranking h1 { font-size: 16px; margin: 0 0 15px 0; letter-spacing: 2px; opacity: 0.9; }
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; height: 100px; }
        .rank-box { background: rgba(255,255,255,0.2); border-radius: 12px 12px 4px 4px; padding: 10px; width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: 0.3s; }
        .rank-1 { height: 100%; background: rgba(255,255,255,0.3); border: 2px solid var(--gold); }
        .rank-2 { height: 80%; }
        .rank-3 { height: 65%; }
        .crown { font-size: 20px; margin-bottom: 5px; }
        .rank-name { font-size: 12px; font-weight: bold; white-space: nowrap; }

        .card { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 15px; margin-top: 0; color: #4a5568; margin-bottom: 15px; }
        
        select { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #edf2f7; font-size: 16px; background: #f8fafc; cursor: pointer; appearance: none; }

        /* ステータス表示 */
        .status-display { margin-top: 25px; border-top: 2px dashed #edf2f7; padding-top: 25px; }
        .area-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .score-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
        .score-item { flex: 1; padding: 15px 5px; border-radius: 18px; text-align: center; color: white; }
        .val { font-size: 22px; font-weight: bold; display: block; }
        .lab { font-size: 10px; font-weight: bold; text-transform: uppercase; }

        .member-card { background: #f8fafc; border-radius: 15px; padding: 15px; }
        .member-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .member-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- 殿堂入り：TOP3表示 -->
    <div class="top-ranking">
        <h1>🏆 全国ポイントランキング</h1>
        <div class="podium" id="top3-podium">
            <!-- JSで動的に生成 -->
            <div class="rank-box rank-2"><span class="rank-name" id="top2-name">--</span></div>
            <div class="rank-box rank-1"><span class="crown">👑</span><span class="rank-name" id="top1-name">--</span></div>
            <div class="rank-box rank-3"><span class="rank-name" id="top3-name">--</span></div>
        </div>
    </div>

    <div class="card">
        <h2>📍 地域を選んで分析</h2>
        <select id="region-select" onchange="loadRegionData()">
            <option value="">都道府県を選択...</option>
        </select>

        <div id="result-area" class="status-display" style="display: none;">
            <div class="area-title"><span id="display-area-name">--</span> の勢力</div>
            
            <div class="score-row">
                <div class="score-item" style="background: var(--sun)"><span id="sun-pt" class="val">0</span><span class="lab">太陽</span></div>
                <div class="score-item" style="background: var(--moon)"><span id="moon-pt" class="val">0</span><span class="lab">月</span></div>
                <div class="score-item" style="background: var(--earth)"><span id="earth-pt" class="val">0</span><span class="lab">地球</span></div>
            </div>

            <div class="member-card">
                <div style="font-size: 11px; color: #a0aec0; margin-bottom: 10px;">主な構成員</div>
                <div id="member-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec";

    // 初期化：プルダウン生成
    window.onload = () => {
        const select = document.getElementById('region-select');
        PREFS.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p;
            opt.innerHTML = p;
            select.appendChild(opt);
        });
        loadOverallRanking(); // 全体ランキング読み込み
    };

    async function loadOverallRanking() {
        try {
            const res = await fetch(`${GAS_URL}?type=getOverallRanking`);
            const data = await res.json(); // [{area: "東京都", total: 260}, ...] 形式を想定
            document.getElementById('top1-name').innerText = data[0]?.area || "待機中";
            document.getElementById('top2-name').innerText = data[1]?.area || "--";
            document.getElementById('top3-name').innerText = data[2]?.area || "--";
        } catch(e) { console.error("Ranking Load Error"); }
    }

    async function loadRegionData() {
        const region = document.getElementById('region-select').value;
        if (!region) return;

        try {
            const res = await fetch(`${GAS_URL}?type=getRegionDetails&area=${encodeURIComponent(region)}`);
            const data = await res.json();

            document.getElementById('display-area-name').innerText = region;
            document.getElementById('sun-pt').innerText = data.points.sun;
            document.getElementById('moon-pt').innerText = data.points.moon;
            document.getElementById('earth-pt').innerText = data.points.earth;

            const list = document.getElementById('member-list');
            list.innerHTML = data.members.map(m => `
                <div class="member-row">
                    <span style="font-size:13px; font-weight:bold;">${m.rank}</span>
                    <span style="font-size:11px; color:#718096;">${m.exp} EXP</span>
                </div>
            `).join('');

            document.getElementById('result-area').style.display = "block";
        } catch (err) { alert("通信エラー"); }
    }
</script>
</body>
</html>
