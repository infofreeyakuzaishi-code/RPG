<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ろぎてむ・クエスト</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* デザイン部分はあなたのこだわりを維持 */
        body { font-family: sans-serif; background: #1a202c; color: #fff; margin: 0; padding: 20px 0; text-align: center; }
        .card { background: #2d3748; width: 92%; max-width: 420px; margin: auto; border-radius: 28px; border: 2px solid #4a5568; padding-bottom: 30px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #44337a 0%, #764ba2 100%); padding: 20px; border-bottom: 3px solid #ed64a6; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
        .label-group { font-size: 11px; color: #718096; margin: 20px; text-align: left; letter-spacing: 2px; font-weight: bold; }
        .stamp-grid { display: flex; justify-content: space-around; padding: 0 15px; gap: 10px; }
        .stamp-btn { background: #3d4957; border: 1px solid #4a5568; border-radius: 18px; flex: 1; padding: 15px 0; font-size: 30px; cursor: pointer; }
        .potion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
        .potion-item { background: #3d4957; border: 1px solid #4a5568; border-radius: 20px; padding: 15px; cursor: pointer; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a202c; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
<div id="loading-overlay">
    <div id="msg">冒険の準備中...</div>
</div>

<div class="card">
    <div class="header"><h1>ROGITEM QUEST</h1></div>
    
    <div class="label-group">今の気分（宿屋で休息）</div>
    <div class="stamp-grid">
        <button class="stamp-btn" onclick="execAction('😊', 'mood')">😊</button>
        <button class="stamp-btn" onclick="execAction('😑', 'mood')">😑</button>
        <button class="stamp-btn" onclick="execAction('😫', 'mood')">😫</button>
        <button class="stamp-btn" onclick="execAction('🤒', 'mood')">🤒</button>
    </div>

    <div class="label-group">ポーション（サプリ・服薬）</div>
    <div id="potion-grid" class="potion-grid">
        <div class="potion-item" onclick="execAction('記録', 'dose')">
            <div style="font-size:24px">🧪</div>
            <div id="item-display" style="font-size:12px">アイテムを記録</div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec"; 
    const LIFF_ID = "2009859584-THwDZKBN";

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            
            const params = new URLSearchParams(window.location.search);
            const item = params.get('item');
            if (item) {
                // itemがある場合は「何のアイテムか」を表示（将来的にはGASから名前を引いてもOK）
                document.getElementById('item-display').innerText = "ポーションを飲む";
            }
            
            document.getElementById('loading-overlay').style.display = 'none';
        } catch (err) {
            document.getElementById('msg').innerText = "エラー: " + err;
        }
    }

    async function execAction(actionName, actionType) {
        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('msg').innerHTML = "冒険の記録を<br>書き留めています...";

        try {
            const profile = await liff.getProfile();
            const params = new URLSearchParams(window.location.search);
            const item = params.get('item');

            // GAS側へ送るデータを整形
            const payload = {
                type: "dose_record", // 記録として統一
                userId: profile.userId,
                item: item || actionName, // ボタンIDがあれば優先
                name: actionName,
                action_type: actionType // mood か dose か
            };

            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });

            // 成功時の演出
            document.getElementById('msg').innerHTML = "✅ 記録完了！<br>経験値を獲得しました";

            setTimeout(() => {
                if (liff.isInClient()) {
                    liff.closeWindow();
                } else {
                    alert("冒険の記録を保存しました！");
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            }, 1500);

        } catch (e) {
            console.error(e);
            alert("通信エラー：セーブに失敗しました");
            document.getElementById('loading-overlay').style.display = 'none';
        }
    }

    main();
</script>
</body>
</html>
