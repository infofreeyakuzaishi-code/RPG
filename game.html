<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROGITAN エコ家計簿 デモ</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --expense-color: #f44336;
      --income-color: #2196F3;
      --defense-color: #FF9800;
      --holiday-color: #e53935;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #e0e0e0; display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .app-header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #ddd;
      color: #333;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    /* --- ROGITAN ホーム --- */
    .rogitan-card {
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .rogitan-avatar {
      font-size: 4rem;
      margin: 10px 0;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .rogitan-speech {
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 12px;
      position: relative;
      display: inline-block;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .rogitan-speech::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: white transparent;
    }
    .level-bar-bg {
      background: rgba(255,255,255,0.6);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .level-bar-fill {
      background: var(--primary-color);
      height: 100%;
      width: 65%;
    }

    /* --- タブ＆フォーム --- */
    .type-tabs {
      display: flex;
      background: #e0e0e0;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .type-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
    }
    .type-tab.active[data-type="expense"] { background: var(--expense-color); color: white; }
    .type-tab.active[data-type="income"] { background: var(--income-color); color: white; }
    .type-tab.active[data-type="defense"] { background: var(--defense-color); color: white; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card-bg);
    }
    .amount-input { font-size: 1.4rem; font-weight: bold; text-align: right; }

    .defense-fields {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }
    .defense-fields.active { display: block; }
    .nutrition-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* --- カレンダー --- */
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .month-nav-btn {
      background: #eee;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .month-nav-btn:hover { background: #ddd; }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #ccc;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .calendar-day-head {
      background: #eee;
      text-align: center;
      padding: 6px 0;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .calendar-day-head.sun { color: var(--holiday-color); }
    .calendar-day-head.sat { color: var(--income-color); }

    .calendar-cell {
      background: white;
      min-height: 54px;
      padding: 2px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .calendar-cell.other-month { background: #fafafa; color: #ccc; cursor: default; }
    .calendar-cell .day-num { font-weight: bold; margin-bottom: 2px; }
    .calendar-cell.is-sun .day-num,
    .calendar-cell.is-holiday .day-num { color: var(--holiday-color); }
    .calendar-cell.is-sat .day-num { color: var(--income-color); }
    .holiday-label { font-size: 0.55rem; color: var(--holiday-color); font-weight: bold; line-height: 1; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .calendar-cell .tag-exp { color: var(--expense-color); font-size: 0.6rem; }
    .calendar-cell .tag-inc { color: var(--income-color); font-size: 0.6rem; }
    .calendar-cell .tag-def { color: var(--defense-color); font-size: 0.6rem; font-weight: bold; }

    /* 月間集計＆明細エリア */
    .detail-list { margin-top: 16px; background: white; border-radius: 8px; padding: 12px; }
    
    .monthly-summary-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      background: #f9f9f9;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }
    .summary-item .sum-title { font-size: 0.7rem; color: #666; margin-bottom: 2px; }
    .summary-item .sum-val { font-size: 0.95rem; font-weight: bold; }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
    }
    .detail-item:last-child { border-bottom: none; }
    .tag-sub { font-size: 0.75rem; color: #888; margin-top: 2px; }

    /* --- カテゴリー設定 --- */
    .cat-manage-list { margin-top: 10px; background: white; border-radius: 8px; }
    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    .cat-item:last-child { border-bottom: none; }
    .cat-actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .btn-edit { background: #ffc107; color: #333; }
    .btn-delete { background: #f44336; color: white; }
    .add-cat-box { display: flex; gap: 8px; margin-top: 12px; }

    /* --- 下部ナビゲーション --- */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid #ddd;
      display: flex;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #888;
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary-color); font-weight: bold; }
    .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header" id="pageTitle">ホーム (ROGITAN)</div>

  <div class="content-area">

    <!-- 1. ホーム -->
    <div id="page-home" class="page active">
      <div class="rogitan-card">
        <div class="rogitan-speech" id="rogitanTalk">「今日もついで買いを我慢して、ボクを育てるロギ！」</div>
        <div class="rogitan-avatar">🦖</div>
        <div style="font-weight: bold; color: #2e7d32;">Lv. 4 ロギタン</div>
        <div style="font-size: 0.75rem; color: #666; margin-top: 4px;">次の進化まで あと 350 kcal / ¥1,800</div>
        <div class="level-bar-bg">
          <div class="level-bar-fill"></div>
        </div>
      </div>

      <div style="background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-around; text-align: center;">
        <div>
          <div style="font-size: 0.75rem; color: #666;">今月の我慢防衛</div>
          <div style="font-size: 1.1rem; font-weight: bold; color: var(--defense-color);">¥4,200</div>
        </div>
        <div style="border-left: 1px solid #eee;"></div>
        <div>
          <div style="font-size: 0.75rem; color: #666;">カットしたカロリー</div>
          <div style="font-size: 1.1rem; font-weight: bold; color: #d84315;">970 kcal</div>
        </div>
      </div>

      <button class="btn-submit" onclick="navTo('input', '簡単入力', document.querySelectorAll('.nav-item')[1])" style="background: var(--defense-color);">🛡️ 我慢を記録する！</button>
    </div>

    <!-- 2. 入力ページ -->
    <div id="page-input" class="page">
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense" onclick="switchType('expense')">支出</div>
        <div class="type-tab" data-type="income" onclick="switchType('income')">収入</div>
        <div class="type-tab" data-type="defense" onclick="switchType('defense')">我慢(エコ)</div>
      </div>

      <form id="logForm" onsubmit="saveLog(event)">
        <div class="form-group">
          <label>金額 (円)</label>
          <input type="number" id="inputAmount" class="form-control amount-input" placeholder="0" required>
        </div>

        <div class="form-group">
          <label>カテゴリー</label>
          <select id="inputCategory" class="form-control"></select>
        </div>

        <div id="defenseFields" class="defense-fields">
          <div style="font-size: 0.85rem; font-weight: bold; color: #d84315; margin-bottom: 8px;">🛡️ 我慢できた内容（任意入力）</div>
          <div class="nutrition-grid">
            <div>
              <label style="font-size:0.75rem; color:#666;">カロリー(kcal)</label>
              <input type="number" id="inputKcal" class="form-control" placeholder="350">
            </div>
            <div>
              <label style="font-size:0.75rem; color:#666;">糖質(g)</label>
              <input type="number" id="inputCarb" class="form-control" placeholder="45">
            </div>
            <div>
              <label style="font-size:0.75rem; color:#666;">脂質(g)</label>
              <input type="number" id="inputFat" class="form-control" placeholder="15">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>日付</label>
          <input type="date" id="inputDate" class="form-control" required>
        </div>

        <div class="form-group">
          <label>メモ (任意)</label>
          <input type="text" id="inputMemo" class="form-control" placeholder="例: コンビニのポテチ">
        </div>

        <button type="submit" class="btn-submit">記録する</button>
      </form>
    </div>

    <!-- 3. カレンダーページ -->
    <div id="page-calendar" class="page">
      <div class="month-header">
        <button class="month-nav-btn" onclick="changeMonth(-1)">◀ 前月</button>
        <span id="currentMonthTitle" style="font-size: 1.05rem; font-weight: bold;">2026年 7月</span>
        <button class="month-nav-btn" onclick="changeMonth(1)">次月 ▶</button>
      </div>
      
      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="detail-list">
        <!-- 月間まとめ表示欄 -->
        <div class="monthly-summary-box">
          <div class="summary-item">
            <div class="sum-title">今月の支出</div>
            <div class="sum-val" id="sumExpense" style="color: var(--expense-color);">¥0</div>
          </div>
          <div class="summary-item">
            <div class="sum-title">今月の収入</div>
            <div class="sum-val" id="sumIncome" style="color: var(--income-color);">¥0</div>
          </div>
          <div class="summary-item">
            <div class="sum-title">今月の我慢(防衛)</div>
            <div class="sum-val" id="sumDefense" style="color: var(--defense-color);">¥0</div>
          </div>
        </div>

        <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.9rem;" id="selectedDateTitle">7月全体のまとめ</div>
        <div id="detailListContent"></div>
      </div>
    </div>

    <!-- 4. 設定（カテゴリー管理）ページ -->
    <div id="page-settings" class="page">
      <h3 style="font-size: 1rem; margin-bottom: 12px;">カテゴリーの編集・管理</h3>
      
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense" onclick="switchSettingType('expense')">支出用</div>
        <div class="type-tab" data-type="income" onclick="switchSettingType('income')">収入用</div>
        <div class="type-tab" data-type="defense" onclick="switchSettingType('defense')">我慢用</div>
      </div>

      <div class="add-cat-box">
        <input type="text" id="newCatName" class="form-control" placeholder="新しいカテゴリー名">
        <button onclick="addCategory()" style="padding: 0 16px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold;">追加</button>
      </div>

      <div class="cat-manage-list" id="catManageList"></div>
    </div>

  </div>

  <!-- 下部ナビゲーション -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="navTo('home', 'ホーム (ROGITAN)', this)">
      <div class="nav-icon">🦖</div>
      <div>ホーム</div>
    </div>
    <div class="nav-item" onclick="navTo('input', '簡単入力', this)">
      <div class="nav-icon">✏️</div>
      <div>入力</div>
    </div>
    <div class="nav-item" onclick="navTo('calendar', '収支カレンダー', this)">
      <div class="nav-icon">📅</div>
      <div>カレンダー</div>
    </div>
    <div class="nav-item" onclick="navTo('settings', '設定（カテゴリー管理）', this)">
      <div class="nav-icon">⚙️</div>
      <div>設定</div>
    </div>
  </div>
</div>

<script>
  let currentType = 'expense';
  let settingType = 'expense';

  let viewYear = 2026;
  let viewMonth = 7;

  let categories = {
    expense: ['食材費（家）', '外食費', '日用品', '交通費', '娯楽'],
    income: ['給与', '副収入', '臨時収入'],
    defense: ['ついで買い我慢', '外食回避自炊', 'スイーツ我慢', 'サブスク解約']
  };

  const sampleLogs = [
    { date: '2026-05-03', type: 'expense', category: '娯楽', amount: 3200, memo: 'GWおでかけ' },
    { date: '2026-06-15', type: 'defense', category: 'ついで買い我慢', amount: 500, kcal: 250, memo: '先月の我慢テスト' },
    { date: '2026-07-20', type: 'expense', category: '食材費（家）', amount: 2580, memo: 'スーパー買い出し' },
    { date: '2026-07-20', type: 'defense', category: '外食回避自炊', amount: 1200, kcal: 650, carb: 80, fat: 20, memo: '夜のカツ丼我慢して自炊' },
    { date: '2026-07-21', type: 'expense', category: '外食費', amount: 950, memo: 'ランチ' },
    { date: '2026-07-21', type: 'defense', category: 'スイーツ我慢', amount: 300, kcal: 320, carb: 40, fat: 12, memo: 'コンビニケーキ我慢' },
    { date: '2026-09-21', type: 'expense', category: '外食費', amount: 1500, memo: '敬老の日ランチ' },
    { date: '2026-09-22', type: 'defense', category: 'ついで買い我慢', amount: 400, kcal: 200, memo: '国民の休日ドトールガマン' }
  ];

  /* --- 国民の祝日計算 --- */
  function getPureNationalHoliday(year, month, day) {
    const dateObj = new Date(year, month - 1, day);
    const dayOfWeek = dateObj.getDay();

    const vernalEquinox = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    const autumnalEquinox = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));

    const isNthMonday = (n) => dayOfWeek === 1 && Math.ceil(day / 7) === n;

    if (month === 1) {
      if (day === 1) return '元日';
      if (isNthMonday(2)) return '成人の日';
    } else if (month === 2) {
      if (day === 11) return '建国記念の日';
      if (day === 23) return '天皇誕生日';
    } else if (month === 3) {
      if (day === vernalEquinox) return '春分の日';
    } else if (month === 4) {
      if (day === 29) return '昭和の日';
    } else if (month === 5) {
      if (day === 3) return '憲法記念日';
      if (day === 4) return 'みどりの日';
      if (day === 5) return 'こどもの日';
    } else if (month === 7) {
      if (isNthMonday(3)) return '海の日';
    } else if (month === 8) {
      if (day === 11) return '山の日';
    } else if (month === 9) {
      if (isNthMonday(3)) return '敬老の日';
      if (day === autumnalEquinox) return '秋分の日';
    } else if (month === 10) {
      if (isNthMonday(2)) return 'スポーツの日';
    } else if (month === 11) {
      if (day === 3) return '文化の日';
      if (day === 23) return '勤労感謝の日';
    }

    return '';
  }

  function getJapaneseHoliday(year, month, day) {
    const pureHoliday = getPureNationalHoliday(year, month, day);
    if (pureHoliday) return pureHoliday;

    const targetDate = new Date(year, month - 1, day);
    const dayOfWeek = targetDate.getDay();

    if (dayOfWeek === 1) {
      const prevDate = new Date(year, month - 1, day - 1);
      const prevHoliday = getPureNationalHoliday(prevDate.getFullYear(), prevDate.getMonth() + 1, prevDate.getDate());
      if (prevHoliday) return '振替休日';
    }

    const prevDate = new Date(year, month - 1, day - 1);
    const nextDate = new Date(year, month - 1, day + 1);

    const prevHoliday = getPureNationalHoliday(prevDate.getFullYear(), prevDate.getMonth() + 1, prevDate.getDate());
    const nextHoliday = getPureNationalHoliday(nextDate.getFullYear(), nextDate.getMonth() + 1, nextDate.getDate());

    if (prevHoliday && nextHoliday) {
      return '国民の休日';
    }

    return '';
  }

  window.onload = () => {
    document.getElementById('inputDate').value = '2026-07-21';
    updateCategoryDropdown();
    renderCalendar();
    renderCategoryManageList();
  };

  function switchType(type) {
    currentType = type;
    document.querySelectorAll('#page-input .type-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === type);
    });
    document.getElementById('defenseFields').classList.toggle('active', type === 'defense');
    updateCategoryDropdown();
  }

  function updateCategoryDropdown() {
    const select = document.getElementById('inputCategory');
    select.innerHTML = '';
    categories[currentType].forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  function navTo(pageId, title, element) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');
    document.getElementById('pageTitle').textContent = title;

    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
  }

  function saveLog(e) {
    e.preventDefault();
    const amount = document.getElementById('inputAmount').value;
    const category = document.getElementById('inputCategory').value;
    const date = document.getElementById('inputDate').value;
    const memo = document.getElementById('inputMemo').value;

    const logData = { date, type: currentType, category, amount: Number(amount), memo };

    if (currentType === 'defense') {
      logData.kcal = document.getElementById('inputKcal').value || 0;
      logData.carb = document.getElementById('inputCarb').value || 0;
      logData.fat = document.getElementById('inputFat').value || 0;

      document.getElementById('rogitanTalk').textContent = `「素晴らしいロギ！${logData.kcal}kcalも防衛したロギね！」`;
    }

    sampleLogs.push(logData);
    alert(`記録しました！`);
    
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputMemo').value = '';

    const d = new Date(date);
    viewYear = d.getFullYear();
    viewMonth = d.getMonth() + 1;
    
    renderCalendar();
    showDailyDetail(date);
    navTo('home', 'ホーム (ROGITAN)', document.querySelectorAll('.nav-item')[0]);
  }

  function changeMonth(diff) {
    viewMonth += diff;
    if (viewMonth < 1) {
      viewMonth = 12;
      viewYear--;
    } else if (viewMonth > 12) {
      viewMonth = 1;
      viewYear++;
    }
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('currentMonthTitle').textContent = `${viewYear}年 ${viewMonth}月`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const days = [
      { name: '日', cls: 'sun' }, { name: '月', cls: '' }, { name: '火', cls: '' },
      { name: '水', cls: '' }, { name: '木', cls: '' }, { name: '金', cls: '' }, { name: '土', cls: 'sat' }
    ];
    days.forEach(d => {
      const head = document.createElement('div');
      head.className = `calendar-day-head ${d.cls}`;
      head.textContent = d.name;
      grid.appendChild(head);
    });

    const firstDay = new Date(viewYear, viewMonth - 1, 1);
    const lastDay = new Date(viewYear, viewMonth, 0);
    const startDayOfWeek = firstDay.getDay();
    const totalDays = lastDay.getDate();

    const prevMonthLastDay = new Date(viewYear, viewMonth - 1, 0).getDate();
    for (let p = startDayOfWeek - 1; p >= 0; p--) {
      const cell = document.createElement('div');
      cell.className = 'calendar-cell other-month';
      cell.innerHTML = `<div class="day-num">${prevMonthLastDay - p}</div>`;
      grid.appendChild(cell);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dateObj = new Date(viewYear, viewMonth - 1, day);
      const dayOfWeek = dateObj.getDay();
      const mStr = viewMonth < 10 ? '0' + viewMonth : viewMonth;
      const dStr = day < 10 ? '0' + day : day;
      const dateStr = `${viewYear}-${mStr}-${dStr}`;

      const holidayName = getJapaneseHoliday(viewYear, viewMonth, day);

      const cell = document.createElement('div');
      let cellCls = 'calendar-cell';
      if (dayOfWeek === 0) cellCls += ' is-sun';
      if (dayOfWeek === 6) cellCls += ' is-sat';
      if (holidayName) cellCls += ' is-holiday';
      cell.className = cellCls;
      
      // 日付タップでその日の明細を表示
      cell.onclick = () => showDailyDetail(dateStr);

      let dayHtml = `<div class="day-num">${day}</div>`;
      if (holidayName) {
        dayHtml += `<div class="holiday-label" title="${holidayName}">${holidayName}</div>`;
      }

      const dayLogs = sampleLogs.filter(l => l.date === dateStr);
      dayLogs.forEach(l => {
        if(l.type === 'expense') dayHtml += `<div class="tag-exp">-¥${l.amount}</div>`;
        if(l.type === 'income') dayHtml += `<div class="tag-inc">+¥${l.amount}</div>`;
        if(l.type === 'defense') dayHtml += `<div class="tag-def">🛡¥${l.amount}</div>`;
      });

      cell.innerHTML = dayHtml;
      grid.appendChild(cell);
    }

    // 月全体のサマリーと一覧の更新
    updateMonthlySummary();
  }

  /* --- 今月全体の集計と表示 --- */
  function updateMonthlySummary() {
    const mStr = viewMonth < 10 ? '0' + viewMonth : viewMonth;
    const monthPrefix = `${viewYear}-${mStr}`;
    
    // 該当月のデータだけを抽出
    const monthlyLogs = sampleLogs.filter(l => l.date.startsWith(monthPrefix));

    let sumExp = 0, sumInc = 0, sumDef = 0;
    monthlyLogs.forEach(l => {
      if (l.type === 'expense') sumExp += l.amount;
      if (l.type === 'income') sumInc += l.amount;
      if (l.type === 'defense') sumDef += l.amount;
    });

    // 上部サマリーの数値を更新
    document.getElementById('sumExpense').textContent = `¥${sumExp.toLocaleString()}`;
    document.getElementById('sumIncome').textContent = `¥${sumInc.toLocaleString()}`;
    document.getElementById('sumDefense').textContent = `¥${sumDef.toLocaleString()}`;

    // 下部タイトルとリストを「月間全体」に更新
    document.getElementById('selectedDateTitle').textContent = `${viewMonth}月全体の明細`;
    renderLogList(monthlyLogs);
  }

  /* --- 特定の日付タップ時の明細表示 --- */
  function showDailyDetail(dateStr) {
    const dayLogs = sampleLogs.filter(l => l.date === dateStr);
    const d = new Date(dateStr);
    const month = d.getMonth() + 1;
    const day = d.getDate();

    document.getElementById('selectedDateTitle').textContent = `${month}月${day}日の明細`;
    renderLogList(dayLogs);
  }

  /* --- 明細リストを描画する共通処理 --- */
  function renderLogList(logs) {
    const container = document.getElementById('detailListContent');
    container.innerHTML = '';

    if (logs.length === 0) {
      container.innerHTML = '<div style="color:#999; font-size:0.85rem; padding: 8px 0;">記録はありません</div>';
      return;
    }

    // 日付順にソート（新しい順）
    logs.sort((a, b) => b.date.localeCompare(a.date));

    logs.forEach(l => {
      const item = document.createElement('div');
      item.className = 'detail-item';
      const typeLabel = l.type === 'expense' ? '支出' : l.type === 'income' ? '収入' : '我慢';
      const color = l.type === 'expense' ? 'var(--expense-color)' : l.type === 'income' ? 'var(--income-color)' : 'var(--defense-color)';
      
      let subInfo = l.memo || '';
      if (l.type === 'defense' && (l.kcal > 0 || l.carb > 0 || l.fat > 0)) {
        subInfo += ` (${l.kcal || 0}kcal / 糖質:${l.carb || 0}g / 脂質:${l.fat || 0}g)`;
      }

      item.innerHTML = `
        <div>
          <span style="font-weight:bold; color:${color}">[${typeLabel}] ${l.category}</span>
          <span style="font-size:0.75rem; color:#999; margin-left:6px;">${l.date.substring(5)}</span>
          <div class="tag-sub">${subInfo}</div>
        </div>
        <div style="font-weight:bold; color:${color}">
          ${l.type === 'expense' ? '-' : l.type === 'income' ? '+' : '🛡 '}¥${l.amount.toLocaleString()}
        </div>
      `;
      container.appendChild(item);
    });
  }

  /* --- カテゴリー設定機能 --- */
  function switchSettingType(type) {
    settingType = type;
    document.querySelectorAll('#page-settings .type-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === type);
    });
    renderCategoryManageList();
  }

  function renderCategoryManageList() {
    const list = document.getElementById('catManageList');
    list.innerHTML = '';
    categories[settingType].forEach((cat, index) => {
      const item = document.createElement('div');
      item.className = 'cat-item';
      item.innerHTML = `
        <span style="font-weight:bold;">${cat}</span>
        <div class="cat-actions">
          <button class="btn-edit" onclick="editCategory(${index})">編集</button>
          <button class="btn-delete" onclick="deleteCategory(${index})">削除</button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function addCategory() {
    const input = document.getElementById('newCatName');
    const val = input.value.trim();
    if (!val) return;
    categories[settingType].push(val);
    input.value = '';
    renderCategoryManageList();
    updateCategoryDropdown();
  }

  function editCategory(index) {
    const oldName = categories[settingType][index];
    const newName = prompt('新しいカテゴリー名を入力してください:', oldName);
    if (newName && newName.trim() !== '') {
      categories[settingType][index] = newName.trim();
      renderCategoryManageList();
      updateCategoryDropdown();
    }
  }

  function deleteCategory(index) {
    if (confirm(`「${categories[settingType][index]}」を削除しますか？`)) {
      categories[settingType].splice(index, 1);
      renderCategoryManageList();
      updateCategoryDropdown();
    }
  }
</script>

</body>
</html>
