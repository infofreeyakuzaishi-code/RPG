<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROGITAN エコ家計簿 デモ (カテゴリー編集＆栄養素機能追加版)</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --expense-color: #f44336;
      --income-color: #2196F3;
      --defense-color: #FF9800;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #e0e0e0; display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .app-header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #ddd;
      color: #333;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    /* --- タブ切替 --- */
    .type-tabs {
      display: flex;
      background: #e0e0e0;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .type-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
    }
    .type-tab.active[data-type="expense"] { background: var(--expense-color); color: white; }
    .type-tab.active[data-type="income"] { background: var(--income-color); color: white; }
    .type-tab.active[data-type="defense"] { background: var(--defense-color); color: white; }

    /* フォーム要素 */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card-bg);
    }
    .amount-input { font-size: 1.4rem; font-weight: bold; text-align: right; }

    /* 我慢専用フィールドエリア */
    .defense-fields {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: none; /* デフォルト非表示 */
    }
    .defense-fields.active { display: block; }
    .nutrition-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    /* --- カレンダー＆明細 --- */
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #ccc;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .calendar-day-head {
      background: #eee;
      text-align: center;
      padding: 6px 0;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .calendar-cell {
      background: white;
      min-height: 52px;
      padding: 2px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .calendar-cell .day-num { font-weight: bold; margin-bottom: 2px; }
    .calendar-cell .tag-exp { color: var(--expense-color); font-size: 0.65rem; }
    .calendar-cell .tag-inc { color: var(--income-color); font-size: 0.65rem; }
    .calendar-cell .tag-def { color: var(--defense-color); font-size: 0.65rem; font-weight: bold; }

    .detail-list { margin-top: 16px; background: white; border-radius: 8px; padding: 12px; }
    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
    }
    .detail-item:last-child { border-bottom: none; }
    .tag-sub { font-size: 0.75rem; color: #888; margin-top: 2px; }

    /* --- 設定（カテゴリー管理）スタイル --- */
    .cat-manage-list { margin-top: 10px; background: white; border-radius: 8px; }
    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    .cat-item:last-child { border-bottom: none; }
    .cat-actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .btn-edit { background: #ffc107; color: #333; }
    .btn-delete { background: #f44336; color: white; }
    .add-cat-box { display: flex; gap: 8px; margin-top: 12px; }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid #ddd;
      display: flex;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #888;
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary-color); font-weight: bold; }
    .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="app-header" id="pageTitle">簡単入力</div>

  <!-- メイン表示エリア -->
  <div class="content-area">
    
    <!-- 1. 入力ページ -->
    <div id="page-input" class="page active">
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense" onclick="switchType('expense')">支出</div>
        <div class="type-tab" data-type="income" onclick="switchType('income')">収入</div>
        <div class="type-tab" data-type="defense" onclick="switchType('defense')">我慢(エコ)</div>
      </div>

      <form id="logForm" onsubmit="saveLog(event)">
        <div class="form-group">
          <label>金額 (円)</label>
          <input type="number" id="inputAmount" class="form-control amount-input" placeholder="0" required>
        </div>

        <div class="form-group">
          <label>カテゴリー</label>
          <select id="inputCategory" class="form-control">
            <!-- 動的挿入 -->
          </select>
        </div>

        <!-- 我慢（エコ）選択時のみ表示される追加入力欄 -->
        <div id="defenseFields" class="defense-fields">
          <div style="font-size: 0.85rem; font-weight: bold; color: #d84315; margin-bottom: 8px;">🛡️ 我慢できた内容（任意入力）</div>
          <div class="nutrition-grid">
            <div>
              <label style="font-size:0.75rem; color:#666;">カロリー(kcal)</label>
              <input type="number" id="inputKcal" class="form-control" placeholder="例: 350">
            </div>
            <div>
              <label style="font-size:0.75rem; color:#666;">糖質(g)</label>
              <input type="number" id="inputCarb" class="form-control" placeholder="例: 45">
            </div>
            <div>
              <label style="font-size:0.75rem; color:#666;">脂質(g)</label>
              <input type="number" id="inputFat" class="form-control" placeholder="例: 15">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>日付</label>
          <input type="date" id="inputDate" class="form-control" required>
        </div>

        <div class="form-group">
          <label>メモ (任意)</label>
          <input type="text" id="inputMemo" class="form-control" placeholder="例: コンビニのポテチと大盛り丼">
        </div>

        <button type="submit" class="btn-submit">記録する</button>
      </form>
    </div>

    <!-- 2. カレンダーページ -->
    <div id="page-calendar" class="page">
      <div class="month-header">
        <span>2026年 7月</span>
        <span style="font-size: 0.85rem; color: #666;">今月の我慢: <b style="color: var(--defense-color);">¥4,200</b></span>
      </div>
      
      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="detail-list">
        <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.9rem;" id="selectedDateTitle">7月21日の明細</div>
        <div id="detailListContent"></div>
      </div>
    </div>

    <!-- 3. カテゴリー設定ページ -->
    <div id="page-settings" class="page">
      <h3 style="font-size: 1rem; margin-bottom: 12px;">カテゴリーの編集・管理</h3>
      
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense" onclick="switchSettingType('expense')">支出用</div>
        <div class="type-tab" data-type="income" onclick="switchSettingType('income')">収入用</div>
        <div class="type-tab" data-type="defense" onclick="switchSettingType('defense')">我慢用</div>
      </div>

      <div class="add-cat-box">
        <input type="text" id="newCatName" class="form-control" placeholder="新しいカテゴリー名">
        <button onclick="addCategory()" style="padding: 0 16px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold;">追加</button>
      </div>

      <div class="cat-manage-list" id="catManageList">
        <!-- 動的挿入 -->
      </div>
    </div>

  </div>

  <!-- 下部ナビゲーション -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="navTo('input', '簡単入力', this)">
      <div class="nav-icon">✏️</div>
      <div>入力</div>
    </div>
    <div class="nav-item" onclick="navTo('calendar', '収支カレンダー', this)">
      <div class="nav-icon">📅</div>
      <div>カレンダー</div>
    </div>
    <div class="nav-item" onclick="navTo('settings', '設定（カテゴリー管理）', this)">
      <div class="nav-icon">⚙️</div>
      <div>設定</div>
    </div>
  </div>
</div>

<script>
  let currentType = 'expense';
  let settingType = 'expense';

  // カテゴリーデータ（ローカルで自由に変更・追加・削除可能）
  let categories = {
    expense: ['食材費（家）', '外食費', '日用品', '交通費', '娯楽'],
    income: ['給与', '副収入', '臨時収入'],
    defense: ['ついで買い我慢', '外食回避自炊', 'スイーツ我慢', 'サブスク解約']
  };

  const sampleLogs = [
    { date: '2026-07-20', type: 'expense', category: '食材費（家）', amount: 2580, memo: 'スーパー買い出し' },
    { date: '2026-07-20', type: 'defense', category: '外食回避自炊', amount: 1200, kcal: 650, carb: 80, fat: 20, memo: '夜のカツ丼我慢して自炊' },
    { date: '2026-07-21', type: 'expense', category: '外食費', amount: 950, memo: 'ランチ' },
    { date: '2026-07-21', type: 'defense', category: 'スイーツ我慢', amount: 300, kcal: 320, carb: 40, fat: 12, memo: 'コンビニケーキ我慢' }
  ];

  window.onload = () => {
    document.getElementById('inputDate').valueAsDate = new Date();
    updateCategoryDropdown();
    renderCalendar();
    showDetail('2026-07-21');
    renderCategoryManageList();
  };

  // 入力タイプの切り替え
  function switchType(type) {
    currentType = type;
    document.querySelectorAll('#page-input .type-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === type);
    });
    
    // 我慢（エコ）の時だけ栄養素入力欄を表示
    const defenseFields = document.getElementById('defenseFields');
    if (type === 'defense') {
      defenseFields.classList.add('active');
    } else {
      defenseFields.classList.remove('active');
    }

    updateCategoryDropdown();
  }

  function updateCategoryDropdown() {
    const select = document.getElementById('inputCategory');
    select.innerHTML = '';
    categories[currentType].forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  // ページ切り替え
  function navTo(pageId, title, element) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');
    document.getElementById('pageTitle').textContent = title;

    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
  }

  // ログ保存
  function saveLog(e) {
    e.preventDefault();
    const amount = document.getElementById('inputAmount').value;
    const category = document.getElementById('inputCategory').value;
    const date = document.getElementById('inputDate').value;
    const memo = document.getElementById('inputMemo').value;

    const logData = { date, type: currentType, category, amount: Number(amount), memo };

    if (currentType === 'defense') {
      logData.kcal = document.getElementById('inputKcal').value || 0;
      logData.carb = document.getElementById('inputCarb').value || 0;
      logData.fat = document.getElementById('inputFat').value || 0;
    }

    sampleLogs.push(logData);
    
    let msg = `【${currentType === 'expense' ? '支出' : currentType === 'income' ? '収入' : '我慢'}】\n${category}: ¥${amount} を記録しました！`;
    if (currentType === 'defense' && logData.kcal > 0) {
      msg += `\n🛡️ 防衛: ${logData.kcal} kcal (糖質:${logData.carb}g / 脂質:${logData.fat}g)`;
    }
    alert(msg);
    
    // リセット
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputMemo').value = '';
    document.getElementById('inputKcal').value = '';
    document.getElementById('inputCarb').value = '';
    document.getElementById('inputFat').value = '';
    renderCalendar();
  }

  // --- カテゴリー管理（設定画面）機能 ---
  function switchSettingType(type) {
    settingType = type;
    document.querySelectorAll('#page-settings .type-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === type);
    });
    renderCategoryManageList();
  }

  function renderCategoryManageList() {
    const list = document.getElementById('catManageList');
    list.innerHTML = '';
    categories[settingType].forEach((cat, index) => {
      const item = document.createElement('div');
      item.className = 'cat-item';
      item.innerHTML = `
        <span style="font-weight:bold;">${cat}</span>
        <div class="cat-actions">
          <button class="btn-edit" onclick="editCategory(${index})">編集</button>
          <button class="btn-delete" onclick="deleteCategory(${index})">削除</button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function addCategory() {
    const input = document.getElementById('newCatName');
    const val = input.value.trim();
    if (!val) return;
    categories[settingType].push(val);
    input.value = '';
    renderCategoryManageList();
    updateCategoryDropdown();
  }

  function editCategory(index) {
    const oldName = categories[settingType][index];
    const newName = prompt('新しいカテゴリー名を入力してください:', oldName);
    if (newName && newName.trim() !== '') {
      categories[settingType][index] = newName.trim();
      renderCategoryManageList();
      updateCategoryDropdown();
    }
  }

  function deleteCategory(index) {
    if (confirm(`「${categories[settingType][index]}」を削除しますか？`)) {
      categories[settingType].splice(index, 1);
      renderCategoryManageList();
      updateCategoryDropdown();
    }
  }

  // カレンダー描画
  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    days.forEach(d => {
      const head = document.createElement('div');
      head.className = 'calendar-day-head';
      head.textContent = d;
      grid.appendChild(head);
    });

    for (let i = 1; i <= 31; i++) {
      const dateStr = `2026-07-${i < 10 ? '0' + i : i}`;
      const cell = document.createElement('div');
      cell.className = 'calendar-cell';
      cell.onclick = () => showDetail(dateStr);

      let dayHtml = `<div class="day-num">${i}</div>`;
      const dayLogs = sampleLogs.filter(l => l.date === dateStr);
      dayLogs.forEach(l => {
        if(l.type === 'expense') dayHtml += `<div class="tag-exp">-¥${l.amount}</div>`;
        if(l.type === 'income') dayHtml += `<div class="tag-inc">+¥${l.amount}</div>`;
        if(l.type === 'defense') dayHtml += `<div class="tag-def">🛡¥${l.amount}</div>`;
      });

      cell.innerHTML = dayHtml;
      grid.appendChild(cell);
    }
  }

  // 日別明細の表示
  function showDetail(dateStr) {
    document.getElementById('selectedDateTitle').textContent = `${dateStr} の明細`;
    const container = document.getElementById('detailListContent');
    container.innerHTML = '';

    const dayLogs = sampleLogs.filter(l => l.date === dateStr);
    if (dayLogs.length === 0) {
      container.innerHTML = '<div style="color:#999; font-size:0.85rem;">記録はありません</div>';
      return;
    }

    dayLogs.forEach(l => {
      const item = document.createElement('div');
      item.className = 'detail-item';
      const typeLabel = l.type === 'expense' ? '支出' : l.type === 'income' ? '収入' : '我慢';
      const color = l.type === 'expense' ? 'var(--expense-color)' : l.type === 'income' ? 'var(--income-color)' : 'var(--defense-color)';
      
      let subInfo = l.memo || '';
      if (l.type === 'defense' && (l.kcal > 0 || l.carb > 0 || l.fat > 0)) {
        subInfo += ` (${l.kcal || 0}kcal / 糖質:${l.carb || 0}g / 脂質:${l.fat || 0}g)`;
      }

      item.innerHTML = `
        <div>
          <span style="font-weight:bold; color:${color}">[${typeLabel}] ${l.category}</span>
          <div class="tag-sub">${subInfo}</div>
        </div>
        <div style="font-weight:bold; color:${color}">
          ${l.type === 'expense' ? '-' : l.type === 'income' ? '+' : '🛡 '}¥${l.amount}
        </div>
      `;
      container.appendChild(item);
    });
  }
</script>

</body>
</html>
