<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROGITAN エコ家計簿 デモ（カレンダー修正＆キャラ融合版）</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --expense-color: #f44336;
      --income-color: #2196F3;
      --defense-color: #FF9800;
      --holiday-color: #e53935;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #e0e0e0; display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .app-header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #ddd;
      color: #333;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    /* --- ROGITAN ホーム画面スタイル --- */
    .rogitan-card {
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      position: relative;
    }
    .rogitan-avatar {
      font-size: 4rem;
      margin: 10px 0;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .rogitan-speech {
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 12px;
      position: relative;
      display: inline-block;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .rogitan-speech::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: white transparent;
    }
    .level-bar-bg {
      background: rgba(255,255,255,0.6);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .level-bar-fill {
      background: var(--primary-color);
      height: 100%;
      width: 65%;
    }

    /* --- タブ＆フォームスタイル --- */
    .type-tabs {
      display: flex;
      background: #e0e0e0;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .type-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
    }
    .type-tab.active[data-type="expense"] { background: var(--expense-color); color: white; }
    .type-tab.active[data-type="income"] { background: var(--income-color); color: white; }
    .type-tab.active[data-type="defense"] { background: var(--defense-color); color: white; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card-bg);
    }
    .amount-input { font-size: 1.4rem; font-weight: bold; text-align: right; }

    .defense-fields {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }
    .defense-fields.active { display: block; }
    .nutrition-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* --- カレンダー（正しく2026年7月に修正） --- */
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #ccc;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .calendar-day-head {
      background: #eee;
      text-align: center;
      padding: 6px 0;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .calendar-day-head.sun { color: var(--holiday-color); }
    .calendar-day-head.sat { color: var(--income-color); }

    .calendar-cell {
      background: white;
      min-height: 54px;
      padding: 2px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .calendar-cell.other-month { background: #fafafa; color: #ccc; }
    .calendar-cell .day-num { font-weight: bold; margin-bottom: 2px; }
    .calendar-cell.is-sun .day-num,
    .calendar-cell.is-holiday .day-num { color: var(--holiday-color); }
    .calendar-cell.is-sat .day-num { color: var(--income-color); }
    .holiday-label { font-size: 0.55rem; color: var(--holiday-color); font-weight: bold; line-height: 1; margin-bottom: 2px; }

    .calendar-cell .tag-exp { color: var(--expense-color); font-size: 0.6rem; }
    .calendar-cell .tag-inc { color: var(--income-color); font-size: 0.6rem; }
    .calendar-cell .tag-def { color: var(--defense-color); font-size: 0.6rem; font-weight: bold; }

    .detail-list { margin-top: 16px; background: white; border-radius: 8px; padding: 12px; }
    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
    }
    .detail-item:last-child { border-bottom: none; }
    .tag-sub { font-size: 0.75rem; color: #888; margin-top: 2px; }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid #ddd;
      display: flex;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #888;
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary-color); font-weight: bold; }
    .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="app-header" id="pageTitle">ホーム (ROGITAN)</div>

  <!-- メイン表示エリア -->
  <div class="content-area">

    <!-- 0. ホーム（ROGITAN融合画面） -->
    <div id="page-home" class="page active">
      <div class="rogitan-card">
        <div class="rogitan-speech" id="rogitanTalk">「今日もついで買いを我慢して、ボクを育てるロギ！」</div>
        <div class="rogitan-avatar">🦖</div>
        <div style="font-weight: bold; color: #2e7d32;">Lv. 4 ロギタン</div>
        <div style="font-size: 0.75rem; color: #666; margin-top: 4px;">次の進化まで あと 350 kcal / ¥1,800</div>
        <div class="level-bar-bg">
          <div class="level-bar-fill"></div>
        </div>
      </div>

      <div style="background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-around; text-align: center;">
        <div>
          <div style="font-size: 0.75rem; color: #666;">今月の我慢防衛</div>
          <div style="font-size: 1.1rem; font-weight: bold; color: var(--defense-color);">¥4,200</div>
        </div>
        <div style="border-left: 1px solid #eee;"></div>
        <div>
          <div style="font-size: 0.75rem; color: #666;">カットしたカロリー</div>
          <div style="font-size: 1.1rem; font-weight: bold; color: #d84315;">970 kcal</div>
        </div>
      </div>

      <button class="btn-submit" onclick="navTo('input', '簡単入力', document.querySelectorAll('.nav-item')[1])" style="background: var(--defense-color);">🛡️ 我慢を記録する！</button>
    </div>

    <!-- 1. 入力ページ -->
    <div id="page-input" class="page">
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense" onclick="switchType('expense')">支出</div>
        <div class="type-tab" data-type="income" onclick="switchType('income')">収入</div>
        <div class="type-tab" data-type="defense" onclick="switchType('defense')">我慢(エコ)</div>
      </div>

      <form id="logForm" onsubmit="saveLog(event)">
        <div class="form-group">
          <label>金額 (円)</label>
          <input type="number" id="inputAmount" class="form-control amount-input" placeholder="0" required>
        </div>

        <div class="form-group">
          <label>カテゴリー</label>
          <select id="inputCategory" class="form-control"></select>
        </div>

        <div id="defenseFields" class="defense-fields">
          <div style="font-size: 0.85rem; font-weight: bold; color: #d84315; margin-bottom: 8px;">🛡️ 我慢できた内容（任意入力）</div>
          <div class="nutrition-grid">
            <div>
              <label style="font-size:0.75rem; color:#666;">カロリー(kcal)</label>
              <input type="number" id="inputKcal" class="form-control" placeholder="350">
            </div>
            <div>
              <label style="font-size:0.75rem; color:#666;">糖質(g)</label>
              <input type="number" id="inputCarb" class="form-control" placeholder="45">
            </div>
            <div>
              <label style="font-size:0.75rem; color:#666;">脂質(g)</label>
              <input type="number" id="inputFat" class="form-control" placeholder="15">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>日付</label>
          <input type="date" id="inputDate" class="form-control" required>
        </div>

        <div class="form-group">
          <label>メモ (任意)</label>
          <input type="text" id="inputMemo" class="form-control" placeholder="例: コンビニのポテチ">
        </div>

        <button type="submit" class="btn-submit">記録する</button>
      </form>
    </div>

    <!-- 2. カレンダーページ -->
    <div id="page-calendar" class="page">
      <div class="month-header">
        <span>2026年 7月</span>
        <span style="font-size: 0.85rem; color: #666;">今月の我慢: <b style="color: var(--defense-color);">¥4,200</b></span>
      </div>
      
      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="detail-list">
        <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.9rem;" id="selectedDateTitle">7月21日の明細</div>
        <div id="detailListContent"></div>
      </div>
    </div>

  </div>

  <!-- 下部ナビゲーション -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="navTo('home', 'ホーム (ROGITAN)', this)">
      <div class="nav-icon">🦖</div>
      <div>ホーム</div>
    </div>
    <div class="nav-item" onclick="navTo('input', '簡単入力', this)">
      <div class="nav-icon">✏️</div>
      <div>入力</div>
    </div>
    <div class="nav-item" onclick="navTo('calendar', '収支カレンダー', this)">
      <div class="nav-icon">📅</div>
      <div>カレンダー</div>
    </div>
  </div>
</div>

<script>
  let currentType = 'expense';

  const categories = {
    expense: ['食材費（家）', '外食費', '日用品', '交通費', '娯楽'],
    income: ['給与', '副収入', '臨時収入'],
    defense: ['ついで買い我慢', '外食回避自炊', 'スイーツ我慢', 'サブスク解約']
  };

  const sampleLogs = [
    { date: '2026-07-20', type: 'expense', category: '食材費（家）', amount: 2580, memo: 'スーパー買い出し' },
    { date: '2026-07-20', type: 'defense', category: '外食回避自炊', amount: 1200, kcal: 650, carb: 80, fat: 20, memo: '夜のカツ丼我慢して自炊' },
    { date: '2026-07-21', type: 'expense', category: '外食費', amount: 950, memo: 'ランチ' },
    { date: '2026-07-21', type: 'defense', category: 'スイーツ我慢', amount: 300, kcal: 320, carb: 40, fat: 12, memo: 'コンビニケーキ我慢' }
  ];

  // 日本の祝日データ（2026年7月）
  const holidays2026Jul = {
    '2026-07-20': '海の日'
  };

  window.onload = () => {
    document.getElementById('inputDate').value = '2026-07-21';
    updateCategoryDropdown();
    renderCalendar();
    showDetail('2026-07-21');
  };

  function switchType(type) {
    currentType = type;
    document.querySelectorAll('#page-input .type-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === type);
    });
    
    document.getElementById('defenseFields').classList.toggle('active', type === 'defense');
    updateCategoryDropdown();
  }

  function updateCategoryDropdown() {
    const select = document.getElementById('inputCategory');
    select.innerHTML = '';
    categories[currentType].forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  function navTo(pageId, title, element) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');
    document.getElementById('pageTitle').textContent = title;

    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
  }

  function saveLog(e) {
    e.preventDefault();
    const amount = document.getElementById('inputAmount').value;
    const category = document.getElementById('inputCategory').value;
    const date = document.getElementById('inputDate').value;
    const memo = document.getElementById('inputMemo').value;

    const logData = { date, type: currentType, category, amount: Number(amount), memo };

    if (currentType === 'defense') {
      logData.kcal = document.getElementById('inputKcal').value || 0;
      logData.carb = document.getElementById('inputCarb').value || 0;
      logData.fat = document.getElementById('inputFat').value || 0;

      // ROGITANのセリフ更新（演出）
      document.getElementById('rogitanTalk').textContent = `「素晴らしいロギ！${logData.kcal}kcalも防衛したロギね！」`;
    }

    sampleLogs.push(logData);
    alert(`記録しました！`);
    
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputMemo').value = '';
    renderCalendar();
    navTo('home', 'ホーム (ROGITAN)', document.querySelectorAll('.nav-item')[0]);
  }

  // --- 2026年7月の正確なカレンダー描画 ---
  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const days = [
      { name: '日', cls: 'sun' }, { name: '月', cls: '' }, { name: '火', cls: '' },
      { name: '水', cls: '' }, { name: '木', cls: '' }, { name: '金', cls: '' }, { name: '土', cls: 'sat' }
    ];
    days.forEach(d => {
      const head = document.createElement('div');
      head.className = `calendar-day-head ${d.cls}`;
      head.textContent = d.name;
      grid.appendChild(head);
    });

    // 2026年7月1日＝水曜日（オフセット: 3マス空白［6/28〜6/30］）
    // 前月の穴埋め（3日間）
    for (let p = 28; p <= 30; p++) {
      const cell = document.createElement('div');
      cell.className = 'calendar-cell other-month';
      cell.innerHTML = `<div class="day-num">${p}</div>`;
      grid.appendChild(cell);
    }

    // 7月1日〜31日
    for (let day = 1; day <= 31; day++) {
      // 曜日の算出 (1日が水曜=3)
      const dayOfWeek = (3 + (day - 1)) % 7; 
      const dateStr = `2026-07-${day < 10 ? '0' + day : day}`;
      
      const cell = document.createElement('div');
      let cellCls = 'calendar-cell';
      if (dayOfWeek === 0) cellCls += ' is-sun';
      if (dayOfWeek === 6) cellCls += ' is-sat';
      if (holidays2026Jul[dateStr]) cellCls += ' is-holiday';
      cell.className = cellCls;
      cell.onclick = () => showDetail(dateStr);

      let dayHtml = `<div class="day-num">${day}</div>`;
      if (holidays2026Jul[dateStr]) {
        dayHtml += `<div class="holiday-label">${holidays2026Jul[dateStr]}</div>`;
      }

      // 当日のログ
      const dayLogs = sampleLogs.filter(l => l.date === dateStr);
      dayLogs.forEach(l => {
        if(l.type === 'expense') dayHtml += `<div class="tag-exp">-¥${l.amount}</div>`;
        if(l.type === 'income') dayHtml += `<div class="tag-inc">+¥${l.amount}</div>`;
        if(l.type === 'defense') dayHtml += `<div class="tag-def">🛡¥${l.amount}</div>`;
      });

      cell.innerHTML = dayHtml;
      grid.appendChild(cell);
    }
  }

  function showDetail(dateStr) {
    document.getElementById('selectedDateTitle').textContent = `${dateStr} の明細`;
    const container = document.getElementById('detailListContent');
    container.innerHTML = '';

    const dayLogs = sampleLogs.filter(l => l.date === dateStr);
    if (dayLogs.length === 0) {
      container.innerHTML = '<div style="color:#999; font-size:0.85rem;">記録はありません</div>';
      return;
    }

    dayLogs.forEach(l => {
      const item = document.createElement('div');
      item.className = 'detail-item';
      const typeLabel = l.type === 'expense' ? '支出' : l.type === 'income' ? '収入' : '我慢';
      const color = l.type === 'expense' ? 'var(--expense-color)' : l.type === 'income' ? 'var(--income-color)' : 'var(--defense-color)';
      
      let subInfo = l.memo || '';
      if (l.type === 'defense' && (l.kcal > 0 || l.carb > 0 || l.fat > 0)) {
        subInfo += ` (${l.kcal || 0}kcal / 糖質:${l.carb || 0}g / 脂質:${l.fat || 0}g)`;
      }

      item.innerHTML = `
        <div>
          <span style="font-weight:bold; color:${color}">[${typeLabel}] ${l.category}</span>
          <div class="tag-sub">${subInfo}</div>
        </div>
        <div style="font-weight:bold; color:${color}">
          ${l.type === 'expense' ? '-' : l.type === 'income' ? '+' : '🛡 '}¥${l.amount}
        </div>
      `;
      container.appendChild(item);
    });
  }
</script>

</body>
</html>
