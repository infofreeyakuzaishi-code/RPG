<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROGITAN エコ・防衛デモ</title>
  <style>
    /* アプリ全体の背景（少しクリーム色の和紙っぽい質感） */
    :root {
      --app-bg: #fdfae6; /* 元画像の背景に近い色 */
      --card-bg: #ffffff;
      --text: #3e2723; /* ロゴの文字色に近い焦げ茶色 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    
    body {
      background-color: var(--app-bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* アプリのカードコンテナ */
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: center;
    }

    /* キャラクター表示エリア（背景グラデーション） */
    .char-stage {
      background: linear-gradient(180deg, #fff9c4 0%, #ffffff 100%);
      border-radius: 16px;
      padding: 40px 20px;
      border: 1px solid #eee;
      position: relative;
      overflow: hidden;
    }

    /* 吹き出し */
    .speech-bubble {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #444;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      z-index: 2;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    /* =========================================
       ★ここからROGITANのアニメーション設定
    ========================================= */

    /* コンテナ全体をふわふわ上下させる */
    .rogitan-container {
      margin-top: 30px; /* 吹き出しの下に配置 */
      position: relative;
      
      /* アニメーション1：上下浮遊（float） */
      animation: float 4s ease-in-out infinite;
    }

    /* 元画像（image.png）自体を「息づかい（伸縮）」させる */
    .rogitan-img {
      display: block;
      margin: 0 auto;
      max-width: 200px; /* 必要に応じてサイズ調整 */
      height: auto;
      
      /* アニメーション2：息づかい伸縮（breathe） */
      animation: breathe 5s ease-in-out infinite;
      
      /* 伸縮の中心を足元にする（立体感が出る） */
      transform-origin: bottom center;
    }

    /* アニメーション定義1：上下浮遊（float） */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); } /* ゆっくり上に移動 */
    }

    /* アニメーション定義2：息づかい伸縮（breathe） */
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }    /* 元のサイズ */
      50% { transform: scaleY(1.03); }      /* 縦に3%だけゆっくり伸びる */
    }

    /* ========================================= */

    /* 経験値バーなど（前のデモの流用） */
    .exp-bar-container { width: 100%; background: #e0e0e0; height: 10px; border-radius: 5px; margin-top: 20px; overflow: hidden; }
    .exp-bar { width: 65%; height: 100%; background: #ff9800; } /* ROGITANのオレンジに合わせてアクセントカラーに */

    /* ステータス */
    .status { margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
    .status-val { color: #f57c00; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- キャラクターエリア -->
  <div class="char-stage">
    <div class="speech-bubble">「防衛システム起動！ROGITANがあなたのエコをサポートするよ！」</div>
    
    <!-- ★アニメーション用のコンテナと画像 -->
    <div class="rogitan-container">
      <!-- 元画像をそのまま指定 -->
      <img src="DD76E8A3-67FB-4A8E-B4B9-608C8B430CC0.png" alt="ROGITAN" class="rogitan-img">
    </div>

    <div class="exp-bar-container">
      <div class="exp-bar"></div>
    </div>
  </div>

  <!-- ステータス表示 -->
  <div class="status">
    今月の防衛資金: <span class="status-val">¥4,800</span> / 
    削減エネルギー: <span class="status-val">3,200 kcal</span>
  </div>
</div>

</body>
</html>
