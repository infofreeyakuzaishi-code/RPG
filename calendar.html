<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身体データ・究極ログ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --main-grad: linear-gradient(135deg, #68d391 0%, #4fd1c5 100%); --bg: #f0f4f8; --text: #2d3748; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: var(--text); }
        .card { background: white; width: 100%; max-width: 420px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; margin-bottom: 20px; }
        
        .header { background: var(--main-grad); color: white; padding: 20px 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 19px; font-weight: 800; }

        /* カレンダー部分 */
        .calendar-section { padding: 15px; border-bottom: 1px solid #edf2f7; }
        .status-badge { font-size: 0.9em; font-weight: bold; padding: 12px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 2px solid #e2e8f0; }
        .checked { border-color: #38b2ac; background-color: #e6fffa; color: #234e52; }
        .unchecked { border-color: #feb2b2; background-color: #fff5f5; color: #9b2c2c; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-label { font-size: 0.7em; color: #718096; text-align: center; font-weight: bold; }
        .date-cell { position: relative; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85em; background: #f8fafc; border: 1px solid transparent; }
        .today { border: 2px solid #4fd1c5; font-weight: bold; color: #2c7a7b; }
        .stamp { position: absolute; font-size: 1.1em; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.9; }

        /* 履歴タイムライン */
        .history-section { width: 100%; max-width: 420px; padding-bottom: 30px; }
        .history-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px; border: 1px solid #f1f5f9; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .history-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 8px; }
        .data-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .data-pill { background: #f1f5f9; padding: 4px 10px; border-radius: 8px; font-size: 11px; color: #475569; }
        .memo-box { margin-top: 8px; font-size: 12px; color: #718096; background: #fffaf0; padding: 8px; border-radius: 8px; }

        #loader { padding: 50px; text-align: center; color: #4fd1c5; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>📊 身体データ究極ログ</h1>
    </div>

    <div class="calendar-section">
        <h3 id="month-title" style="text-align: center; font-size: 16px; margin: 0 0 10px;">--年 --月</h3>
        <div id="status-badge" class="status-badge">読み込み中...</div>
        <div class="calendar-grid" id="calendar-grid">
            <div class="day-label">日</div><div class="day-label">月</div><div class="day-label">火</div><div class="day-label">水</div><div class="day-label">木</div><div class="day-label">金</div><div class="day-label">土</div>
        </div>
    </div>
</div>

<div class="history-section" id="history-list">
    <div id="loader">データを取得中...</div>
</div>

<script>
    const LIFF_ID = "2009859584-hpWzb3gO"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec";

    async function init() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            
            // GASからバイタル履歴と服薬履歴をまとめて取得
            const res = await fetch(`${GAS_URL}?type=getVitalData&userId=${profile.userId}`);
            const data = await res.json();

            // 1. カレンダーの描画（日付リストを抽出）
            const completedDates = data.map(item => item.date);
            renderCalendar(completedDates);

            // 2. タイムラインの描画
            renderHistory(data);

        } catch (error) {
            console.error(error);
            document.getElementById('loader').innerText = "データの取得に失敗しました";
        }
    }

    function renderCalendar(completedDates) {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const todayStr = `${year}-${("0" + (month + 1)).slice(-2)}-${("0" + now.getDate()).slice(-2)}`;
        
        document.getElementById('month-title').innerText = `${year}年 ${month + 1}月`;
        const badge = document.getElementById('status-badge');

        if (completedDates.includes(todayStr)) {
            badge.innerText = "✨ 本日の記録完了！ナイス継続！";
            badge.className = "status-badge checked";
        } else {
            badge.innerText = "🥤 本日のデータを記録しましょう！";
            badge.className = "status-badge unchecked";
        }

        const grid = document.getElementById('calendar-grid');
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        // 空白
        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="date-cell"></div>`;
        // 日付
        for (let date = 1; date <= lastDate; date++) {
            const dateStr = `${year}-${("0" + (month + 1)).slice(-2)}-${("0" + date).slice(-2)}`;
            const isToday = dateStr === todayStr ? 'today' : '';
            const hasStamp = completedDates.includes(dateStr) ? '<span class="stamp">✅</span>' : '';
            grid.innerHTML += `<div class="date-cell ${isToday}">${date}${hasStamp}</div>`;
        }
    }

    function renderHistory(data) {
        const list = document.getElementById('history-list');
        if (!data || data.length === 0) {
            list.innerHTML = "<p style='text-align:center; color:#94a3b8;'>履歴がまだありません</p>";
            return;
        }

        list.innerHTML = data.map(item => `
            <div class="history-card">
                <div class="history-header">
                    <span>📅 ${item.date}</span>
                    <span style="color:#4fd1c5">RECORDS</span>
                </div>
                <div class="data-row">
                    ${item.weight ? `<div class="data-pill">体重: ${item.weight}kg</div>` : ''}
                    ${item.fat_pc ? `<div class="data-pill">体脂肪: ${item.fat_pc}%</div>` : ''}
                    ${item.steps ? `<div class="data-pill">歩数: ${item.steps}歩</div>` : ''}
                    ${item.libre ? `<div class="data-pill">リブレ: ${item.libre}</div>` : ''}
                </div>
                ${(item.exercise || item.blood) ? `
                    <div class="memo-box">
                        ${item.exercise ? `<div>🏃 ${item.exercise}</div>` : ''}
                        ${item.blood ? `<div>🩸 ${item.blood}</div>` : ''}
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    init();
</script>
</body>
</html>
