<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logy RPG</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* 以前のトップ画面のデザインを再現 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            padding: 30px;
            position: relative;
        }
        
        /* ステータスエリア */
        .status-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .level-badge {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            padding: 8px 24px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.2rem;
        }
        .rank-label {
            font-weight: 800;
            font-size: 1.4rem;
            color: #1f2937;
        }

        /* 経験値バー */
        .exp-section {
            margin-bottom: 30px;
        }
        .exp-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 6px;
            padding: 0 4px;
        }
        .exp-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
        }
        .exp-bar-fill {
            width: 0%;
            height: 100%;
            background: #d1d5db; /* 初期色 */
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* グリッドメニュー */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .menu-item {
            background-color: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 20px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80px;
        }
        .menu-item:active {
            transform: scale(0.96);
            background-color: #f3f4f6;
        }
        .menu-item .title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #374151;
            margin-bottom: 4px;
        }
        .menu-item .subtitle {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        /* ローディングレイヤー */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            z-index: 100;
            font-weight: bold;
            color: #6366f1;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loader">Loading...</div>

    <!-- ステータス表示 -->
    <div class="status-section">
        <div class="level-badge">Lv. <span id="lv-num">1</span></div>
        <div class="rank-label" id="rank-name">---</div>
    </div>

    <!-- 経験値表示 -->
    <div class="exp-section">
        <div class="exp-text">
            <span>経験値</span>
            <span>Next: <span id="exp-next">--</span></span>
        </div>
        <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="exp-bar-fill"></div>
        </div>
    </div>

    <!-- 4つのスロット -->
    <div class="menu-grid">
        <div class="menu-item" id="slot-0">
            <div class="title">...</div>
            <div class="subtitle">タップで記録</div>
        </div>
        <div class="menu-item" id="slot-1">
            <div class="title">...</div>
            <div class="subtitle">タップで記録</div>
        </div>
        <div class="menu-item" id="slot-2">
            <div class="title">...</div>
            <div class="subtitle">タップで記録</div>
        </div>
        <div class="menu-item" id="slot-3">
            <div class="title">...</div>
            <div class="subtitle">タップで記録</div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec"; 
    const LIFF_URL = "https://liff.line.me/2009859584-THwDZKBN";
    const EXP_TABLE = [0, 30, 100, 250, 500, 850, 1300, 2000, 3000, 5000];

    window.onload = async () => {
        try {
            await liff.init({ liffId: "2009859584-THwDZKBN" });
            
            let userId = "guest_user";
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                userId = profile.userId;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('item') || "rpg-X7M4Q9K2";

            const res = await fetch(`${GAS_URL}?type=getSettings&item=${itemId}&userId=${userId}`);
            const data = await res.json();
            
            // レベル・ランク反映
            const lv = data.level || 1;
            const exp = data.exp || 0;
            document.getElementById('lv-num').innerText = lv;
            
            const ranks = ["見習い", "見習い", "初級冒険者", "中級薬師", "上級薬師", "賢者", "名医", "大賢者", "英雄", "薬神"];
            document.getElementById('rank-name').innerText = ranks[lv] || "薬神";

            // 経験値バー反映
            const nextExp = EXP_TABLE[lv] || "MAX";
            document.getElementById('exp-next').innerText = nextExp;
            const progress = (nextExp === "MAX") ? 100 : (exp / nextExp) * 100;
            const fill = document.getElementById('exp-bar-fill');
            fill.style.width = progress + "%";
            fill.style.background = "#4caf50"; // 読み込み完了後に緑色に

            // スロット（ボタン）反映
            data.buttons.forEach((btn, i) => {
                const slot = document.getElementById(`slot-${i}`);
                if (slot) {
                    const titleEl = slot.querySelector('.title');
                    if (btn && btn.name !== "未設定") {
                        titleEl.innerText = btn.name;
                        slot.onclick = () => { window.location.href = `${LIFF_URL}?item=${btn.id}`; };
                    } else {
                        titleEl.innerText = "未設定";
                        slot.style.opacity = "0.4";
                        slot.onclick = () => { alert("NFCタグから登録してください"); };
                    }
                }
            });

        } catch (err) {
            console.error(err);
            document.getElementById('rank-name').innerText = "Error";
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    };
</script>

</body>
</html>
