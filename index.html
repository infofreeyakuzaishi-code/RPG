<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logy RPG</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #fff;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            text-align: center;
            position: relative;
        }
        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .level-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
        }
        .rank-name {
            font-size: 1.2em;
            color: #333;
            font-weight: bold;
        }
        .exp-container {
            margin: 20px 0;
            text-align: left;
        }
        .exp-bar {
            width: 100%;
            height: 12px;
            background-color: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
            transition: width 0.5s ease;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        .slot {
            background-color: #f8f9fa;
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 20px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .slot:active { transform: scale(0.95); }
        .label { font-weight: bold; color: #555; }
        .sub { font-size: 0.7em; color: #888; margin-top: 4px; }
        
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
            font-weight: bold;
            color: #764ba2;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="loader">Loading...</div>

    <div class="status-header">
        <div class="level-badge">Lv. <span id="lv-num">--</span></div>
        <div class="rank-name" id="rank-name">読み込み中...</div>
    </div>

    <div class="exp-container">
        <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #666;">
            <span>経験値</span>
            <span>Next: <span id="exp-next">--</span></span>
        </div>
        <div class="exp-bar"><div class="exp-fill" id="exp-bar-fill"></div></div>
    </div>

    <div class="grid">
        <div class="slot" id="slot-0"><div class="label">読み込み中...</div></div>
        <div class="slot" id="slot-1"><div class="label">読み込み中...</div></div>
        <div class="slot" id="slot-2"><div class="label">読み込み中...</div></div>
        <div class="slot" id="slot-3"><div class="label">読み込み中...</div></div>
    </div>
</div>

<script>
    // 1. 設定情報
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec"; 
    const LIFF_URL = "https://liff.line.me/2009859584-THwDZKBN";
    const EXP_TABLE = [0, 30, 100, 250, 500, 850, 1300, 2000, 3000, 5000];

    window.onload = async () => {
        try {
            // LIFFの初期化
            await liff.init({ liffId: "2009859584-THwDZKBN" });

            // ユーザーIDの取得（ログインしてなければゲスト扱い）
            let userId = "guest_user";
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                userId = profile.userId;
            }

            // URLからアイテムIDを取得
            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('item') || "rpg-X7M4Q9K2";

            // GASからデータを取得
            const response = await fetch(`${GAS_URL}?type=getSettings&item=${itemId}&userId=${userId}`);
            const data = await response.json();

            // ステータスの反映
            const lv = data.level || 1;
            const exp = data.exp || 0;
            document.getElementById('lv-num').innerText = lv;
            
            const nextExp = EXP_TABLE[lv] || "MAX";
            document.getElementById('exp-next').innerText = nextExp;

            const progress = (nextExp === "MAX") ? 100 : (exp / nextExp) * 100;
            document.getElementById('exp-bar-fill').style.width = progress + "%";

            const ranks = ["見習い", "見習い", "初級冒険者", "中級薬師", "上級薬師", "賢者", "名医", "大賢者", "英雄", "薬神"];
            document.getElementById('rank-name').innerText = ranks[lv] || "薬神";

            // ボタン（スロット）の反映
            data.buttons.forEach((btn, i) => {
                const slotEl = document.getElementById(`slot-${i}`);
                if (slotEl) {
                    if (btn && btn.name !== "未設定") {
                        slotEl.querySelector('.label').innerHTML = `${btn.name}<div class="sub">タップで記録</div>`;
                        slotEl.style.opacity = "1";
                        slotEl.onclick = () => { window.location.href = `${LIFF_URL}?item=${btn.id}`; };
                    } else {
                        slotEl.querySelector('.label').innerText = "＋新規登録";
                        slotEl.style.opacity = "0.5";
                        slotEl.onclick = () => { alert("NFCタグをかざして登録してください"); };
                    }
                }
            });

        } catch (error) {
            console.error("エラー詳細:", error);
            // エラー時も最低限の表示を行う
            document.getElementById('rank-name').innerText = "エラー";
        } finally {
            // 成功・失敗に関わらずLoadingを消す
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = "none";
        }
    };
</script>

</body>
</html>
