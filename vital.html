<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステータス更新</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a202c; color: #fff; padding: 20px; }
        .card { background: #2d3748; padding: 25px; border-radius: 20px; border: 1px solid #4a5568; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #4a5568; background: #1a202c; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: linear-gradient(90deg, #ed64a6, #9f7aea); color: #fff; font-weight: bold; cursor: pointer; }
        #after { display: none; text-align: center; margin-top: 20px; color: #4fd1c5; }
    </style>
</head>
<body>
    <div class="card" id="form">
        <h2 style="color:#ed64a6; text-align:center;">⚖️ ステータス更新</h2>
        <label>体重 (kg)</label><input type="number" id="weight" step="0.1" placeholder="60.0">
        <label>体脂肪率 (%)</label><input type="number" id="fat_pc" step="0.1" placeholder="18.0">
        <label>歩数</label><input type="number" id="steps" placeholder="8000">
        <label>メモ</label><input type="text" id="exercise" placeholder="筋トレなど">
        <button class="btn" onclick="send()">記録して探索終了</button>
    </div>
    <div id="after"><h3>✅ 送信完了！</h3><p>LINEに戻ってください</p></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec";
        const LIFF_ID = "2009859584-THwDZKBN";

        async function send() {
            const w = document.getElementById('weight').value;
            if(!w) return alert("体重を入力してください");
            
            document.getElementById('form').style.opacity = "0.5";
            const profile = await liff.getProfile();

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    type: "vital_record",
                    userId: profile.userId,
                    weight: w,
                    fat_pc: document.getElementById('fat_pc').value || 0,
                    steps: document.getElementById('steps').value || 0,
                    exercise: document.getElementById('exercise').value || ""
                })
            });

            setTimeout(() => {
                document.getElementById('form').style.display = "none";
                document.getElementById('after').style.display = "block";
                setTimeout(() => liff.closeWindow(), 2000);
            }, 1000);
        }

        window.onload = async () => {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) liff.login();
        };
    </script>
</body>
</html>
