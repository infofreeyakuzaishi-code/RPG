<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステータス更新</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a202c; color: #fff; padding: 15px; margin: 0; }
        .card { background: #2d3748; padding: 20px; border-radius: 15px; border: 1px solid #4a5568; max-width: 500px; margin: auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; margin-top: 10px; font-size: 12px; color: #a0aec0; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #4a5568; background: #1a202c; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(90deg, #ed64a6, #9f7aea); color: #fff; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #after { display: none; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card" id="form">
        <h2 style="color:#ed64a6; text-align:center; margin:0 0 15px 0;">⚖️ ステータス更新</h2>
        
        <div class="grid">
            <div><label>体重 (kg)</label><input type="number" id="weight" step="0.1" placeholder="60.0"></div>
            <div><label>歩数</label><input type="number" id="steps" placeholder="8000"></div>
        </div>

        <div class="grid">
            <div><label>体脂肪率 (%)</label><input type="number" id="fat_pc" step="0.1"></div>
            <div><label>体脂肪量 (kg)</label><input type="number" id="fat_kg" step="0.1"></div>
        </div>

        <div class="grid">
            <div><label>筋肉量 (kg)</label><input type="number" id="muscle" step="0.1"></div>
            <div><label>たんぱく率 (%)</label><input type="number" id="protein_pc" step="0.1"></div>
        </div>

        <div class="grid">
            <div><label>水分率 (%)</label><input type="number" id="water_pc" step="0.1"></div>
            <div><label>リブレ (血糖)</label><input type="number" id="libre"></div>
        </div>

        <label>血液検査 / 運動報告など</label>
        <input type="text" id="exercise" placeholder="スクワット30回 / 血液検査の結果など">

        <button class="btn" onclick="send()">ギルドへ報告する</button>
    </div>
    <div id="after"><h3>✅ 報告完了！</h3><p>LINEに戻ってください</p></div>

 <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn99Nvf-FB62_X560HoMlZpP0TOI9mzHKpwnEwyA1STpVG6j0_i7y6H7hjFN0c3vHJ/exec";
    const LIFF_ID = "2009859584-THwDZKBN";

    // ページ読み込み時の初期化
    window.onload = async () => {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                // 初期化成功時にボタンを有効化する（任意）
                console.log("LIFF初期化成功");
            }
        } catch (err) {
            alert("LIFFの初期化に失敗しました: " + err.message);
        }
    };

    async function send() {
        const w = document.getElementById('weight').value;
        if (!w) return alert("体重を入力してください");

        const btn = document.querySelector('.btn');
        btn.disabled = true;
        btn.innerText = "送信中...";
        document.getElementById('form').style.opacity = "0.5";

        try {
            // ここで確実にプロフィールを待機する
            const profile = await liff.getProfile();
            const userId = profile.userId;

            if (!userId) throw new Error("ユーザーIDが取得できませんでした");

            // GASへ送信
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    type: "vital_record",
                    userId: userId,
                    weight: w,
                    fat_pc: document.getElementById('fat_pc').value || "",
                    fat_kg: document.getElementById('fat_kg').value || "",
                    muscle: document.getElementById('muscle').value || "",
                    water_pc: document.getElementById('water_pc').value || "",
                    protein_pc: document.getElementById('protein_pc').value || "",
                    steps: document.getElementById('steps').value || "",
                    libre: document.getElementById('libre').value || "",
                    exercise: document.getElementById('exercise').value || ""
                })
            });

            // 成功時の表示
            document.getElementById('form').style.display = "none";
            document.getElementById('after').style.display = "block";
            setTimeout(() => liff.closeWindow(), 1500);

        } catch (e) {
            // エラー内容をアラートで出す（原因特定のため）
            alert("エラー詳細: " + e.message);
            btn.disabled = false;
            btn.innerText = "記録を報告する";
            document.getElementById('form').style.opacity = "1";
        }
    }
</script>
</body>
</html>
